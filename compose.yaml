services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siteseer_2b}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Use the Compose network even when .env is set up for local development.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-siteseer_2b}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
